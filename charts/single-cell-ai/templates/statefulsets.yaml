{{- range $name, $w := .Values.workloads }}
{{- if and $w.enabled (eq $w.kind "StatefulSet") }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
{{ include "single-cell-ai.labels" (dict "root" $ "component" $name) | nindent 4 }}
spec:
  serviceName: {{ printf "%s-headless" $name }}
  replicas: {{ $w.replicas }}
  selector:
    matchLabels:
{{ include "single-cell-ai.selectorLabels" (dict "root" $ "component" $name) | nindent 6 }}
  template:
{{ include "single-cell-ai.pod" (dict "root" $ "name" $name "workload" $w) | nindent 4 }}
  volumeClaimTemplates:
    - metadata:
        name: {{ $w.persistence.name }}
      spec:
        accessModes:
{{ toYaml $w.persistence.accessModes | nindent 10 }}
        {{- if $w.persistence.storageClassName }}
        storageClassName: {{ $w.persistence.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $w.persistence.size | quote }}
{{- end }}
{{- end }}
