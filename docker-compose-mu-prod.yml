x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - oscb-network
  logging: *default-logging

# Preserve the original, different API vs worker bind sources. They must point
# to the same underlying shared storage when jobs exchange files.
x-api-volumes: &api-volumes
  - ${OSCB_APP_DATA_DIR:-/data/oscb}/results:/data/results
  - ${OSCB_APP_DATA_DIR:-/data/oscb}/uploads:/data/upload
  - ${OSCB_APP_DATA_DIR:-/data/oscb}/logs:/data/logs
  - ${OSCB_APP_DATA_DIR:-/data/oscb}/user_storage:/usr/src/app/storage

x-worker-volumes: &worker-volumes
  - ${OSCB_WORKER_DATA_DIR:-/data/oscb}/results:/data/results
  - ${OSCB_WORKER_DATA_DIR:-/data/oscb}/uploads:/data/upload
  - ${OSCB_WORKER_DATA_DIR:-/data/oscb}/logs:/data/logs
  - ${OSCB_WORKER_DATA_DIR:-/data/oscb}/user_storage:/usr/src/app/storage

x-backend-depends-on: &backend-depends-on
  oscbdb:
    condition: service_healthy
  oscb-redis:
    condition: service_healthy
  oscb-rabbitmq:
    condition: service_healthy

# Shared Celery startup code lives in scripts/celery-entrypoint.py. It loads
# broker passwords from secrets and URL-encodes reserved characters safely.
x-celery-defaults: &celery-defaults
  <<: *service-defaults
  image: stormgod/oscb-api:1.0
  env_file: .env
  init: true
  stop_grace_period: 2m
  entrypoint: ["python3", "/usr/local/bin/celery-entrypoint.py"]
  depends_on: *backend-depends-on
  secrets:
    - rabbitmq_password
    - redis_password

services:
  oscbdb:
    <<: *service-defaults
    container_name: oscbdb
    image: mongo:7.0
    command: ["mongod", "--port", "65530"]
    ports:
      - "${OSCB_ADMIN_BIND_IP:-127.0.0.1}:65530:65530"
    volumes:
      - ${OSCB_APP_DATA_DIR:-/data/oscb}/db/mongodb:/data/db
      - type: bind
        source: ./initMongo.js
        target: /docker-entrypoint-initdb.d/initMongo.js
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--port", "65530", "--eval", "db.adminCommand({ping:1})"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  oscb-redis:
    <<: *service-defaults
    container_name: oscb-redis
    hostname: oscb-redis
    image: redis:6-alpine
    command:
      - /bin/sh
      - -ec
      - |
        exec redis-server --port 6388 --save 20 1 --loglevel warning \
          --requirepass "$$(cat /run/secrets/redis_password)"
    ports:
      - "${OSCB_ADMIN_BIND_IP:-127.0.0.1}:6388:6388"
    volumes:
      - ${OSCB_APP_DATA_DIR:-/data/oscb}/db/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli -p 6388 ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    secrets:
      - redis_password

  oscb-rabbitmq:
    <<: *service-defaults
    container_name: oscb-rabbitmq
    image: "rabbitmq:4.2.8-management"
    env_file: .env
    ports:
      - "${OSCB_ADMIN_BIND_IP:-127.0.0.1}:15672:15672"
    volumes:
      - ${OSCB_APP_DATA_DIR:-/data/oscb}/db/rabbitmq/data:/var/lib/rabbitmq
      - ${OSCB_APP_DATA_DIR:-/data/oscb}/db/rabbitmq/log:/var/log/rabbitmq
    command:
      - /bin/sh
      - -ec
      - |
        export RABBITMQ_DEFAULT_PASS="$$(cat /run/secrets/rabbitmq_password)"
        exec rabbitmq-server
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    secrets:
      - rabbitmq_password

  oscb-mysql:
    <<: *service-defaults
    container_name: oscb-mysql
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --port=3308
    env_file: .env
    ports:
      - "${OSCB_ADMIN_BIND_IP:-127.0.0.1}:3308:3308"
    volumes:
      - ${OSCB_APP_DATA_DIR:-/data/oscb}/mysql_db:/var/lib/mysql
      - type: bind
        source: ./oscb-ui/oscb-mysql/oscb_schema_latest.sql
        target: /docker-entrypoint-initdb.d/oscb_schema_latest.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$$(cat /run/secrets/mysql_password)" mysql --protocol=TCP -h 127.0.0.1 -P 3308 -uroot -Nse "SELECT 1" | grep -qx 1'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    secrets:
      - mysql_password

  celery-api:
    <<: *celery-defaults
    container_name: oscb-celery-api
    ports:
      - "${OSCB_ADMIN_BIND_IP:-127.0.0.1}:5005:5005"
    volumes: *api-volumes
    command: ["python3", "main.py"]

  worker-web:
    <<: *celery-defaults
    volumes: *worker-volumes
    deploy:
      resources:
        limits:
          cpus: "1"
    command:
      - celery
      - -A
      - main.celery
      - worker
      - --loglevel=info
      - -Q
      - web,dataset
      - --concurrency=${OSCB_WEB_WORKER_CONCURRENCY:-2}
      - --prefetch-multiplier=1
      - --max-tasks-per-child=50
      - --max-memory-per-child=${OSCB_CELERY_MAX_MEMORY_KB:-100000000}

  worker-cpu:
    <<: *celery-defaults
    volumes: *worker-volumes
    deploy:
      resources:
        limits:
          cpus: "6"
    command:
      - celery
      - -A
      - main.celery
      - worker
      - --loglevel=info
      - -Q
      - cpu
      - --concurrency=${OSCB_CPU_WORKER_CONCURRENCY:-4}
      - --prefetch-multiplier=1
      - --max-tasks-per-child=50
      - --max-memory-per-child=${OSCB_CELERY_MAX_MEMORY_KB:-100000000}

  worker-gpu:
    <<: *celery-defaults
    profiles: [gpu]
    volumes: *worker-volumes
    deploy:
      resources:
        limits:
          cpus: "6"
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - celery
      - -A
      - main.celery
      - worker
      - --loglevel=info
      - -Q
      - gpu
      - --pool=solo
      - --concurrency=1
      - --prefetch-multiplier=1

  dashboard:
    <<: *celery-defaults
    profiles: [admin]
    container_name: oscb-dashboard
    ports:
      - "${OSCB_ADMIN_BIND_IP:-127.0.0.1}:5555:5555"
    secrets:
      - rabbitmq_password
      - redis_password
      - flower_basicauth_password
    command: ["celery", "--app", "main.celery", "flower", "--port=5555"]

  mongo-express:
    <<: *service-defaults
    profiles: [admin]
    image: mongo-express:latest
    container_name: mongo-express
    env_file: .env
    ports:
      - "${OSCB_ADMIN_BIND_IP:-127.0.0.1}:8081:8081"
    depends_on:
      oscbdb:
        condition: service_healthy
    secrets:
      - mongo_express_password

  oscb-node:
    <<: *service-defaults
    container_name: oscb-node
    image: stormgod/oscb-node:1.0
    env_file: .env
    ports:
      - "${OSCB_ADMIN_BIND_IP:-127.0.0.1}:3001:3001"
      - "${OSCB_ADMIN_BIND_IP:-127.0.0.1}:3020:3020"
    depends_on:
      oscb-mysql:
        condition: service_healthy
    volumes:
      - ${OSCB_APP_DATA_DIR:-/data/oscb}/user_storage:/usr/src/app/storage
    secrets:
      - mysql_password
      - openai_api_key
      - gemini_api_key
      - googledrive_key
      - googledrive_secret
      - dropbox_key
      - dropbox_secret
      - onedrive_key
      - onedrive_secret
      - email_password
      - jwt_token_secret

  oscb-react:
    <<: *service-defaults
    container_name: oscb-react
    image: stormgod/oscb-react:1.0
    env_file: .env
    ports:
      - "${OSCB_ADMIN_BIND_IP:-127.0.0.1}:3000:3000"
    depends_on:
      oscb-node:
        condition: service_started
    secrets:
      - github_token
      - googledrive_key
      - googledrive_secret
      - dropbox_key
      - dropbox_secret
      - onedrive_key
      - onedrive_secret

  directus:
    <<: *service-defaults
    container_name: oscb_directus
    image: directus/directus:9.24.0
    env_file: .env
    ports:
      - "${OSCB_ADMIN_BIND_IP:-127.0.0.1}:8055:8055"
    volumes:
      - ${OSCB_APP_DATA_DIR:-/data/oscb}/Directus_uploads:/directus/uploads
    depends_on:
      oscb-mysql:
        condition: service_healthy
    secrets:
      - mysql_password
      - directus_password
      - directus_key
      - directus_secret

networks:
  oscb-network:
    driver: bridge

secrets:
  mongo_express_password:
    file: ./secrets/mongo_express_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  rabbitmq_password:
    file: ./secrets/rabbitmq_password.txt
  mysql_password:
    file: ./secrets/mysql_password.txt
  github_token:
    file: ./secrets/github_token.txt
  email_password:
    file: ./secrets/email_password.txt
  openai_api_key:
    file: ./secrets/openai_api_key.txt
  gemini_api_key:
    file: ./secrets/gemini_api_key.txt
  jwt_token_secret:
    file: ./secrets/jwt_token_secret.txt
  directus_password:
    file: ./secrets/directus_password.txt
  flower_basicauth_password:
    file: ./secrets/flower_basicauth_password.txt
  googledrive_key:
    file: ./secrets/googledrive_key.txt
  googledrive_secret:
    file: ./secrets/googledrive_secret.txt
  dropbox_key:
    file: ./secrets/dropbox_key.txt
  dropbox_secret:
    file: ./secrets/dropbox_secret.txt
  onedrive_key:
    file: ./secrets/onedrive_key.txt
  onedrive_secret:
    file: ./secrets/onedrive_secret.txt
  directus_key:
    file: ./secrets/directus_key.txt
  directus_secret:
    file: ./secrets/directus_secret.txt
