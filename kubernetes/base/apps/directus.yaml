---
apiVersion: v1
kind: Service
metadata:
  name: directus
  labels:
    app.kubernetes.io/name: single-cell-ai
    app.kubernetes.io/component: directus
spec:
  selector:
    app: directus
  ports:
  - name: http
    port: 8055
    targetPort: 8055
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: directus
  labels:
    app.kubernetes.io/name: single-cell-ai
    app.kubernetes.io/component: directus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: directus
  template:
    metadata:
      labels:
        app: directus
        app.kubernetes.io/part-of: single-cell-ai
    spec:
      containers:
      - name: directus
        image: directus/directus:9.24.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8055
        envFrom:
        - configMapRef:
            name: oscb-app-config
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: oscb-secrets
              key: mysql_password
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: oscb-secrets
              key: directus_password
        - name: KEY
          valueFrom:
            secretKeyRef:
              name: oscb-secrets
              key: directus_key
        - name: SECRET
          valueFrom:
            secretKeyRef:
              name: oscb-secrets
              key: directus_secret
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 2Gi
        readinessProbe:
          tcpSocket:
            port: 8055
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: 8055
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        volumeMounts:
        - name: secrets
          mountPath: /run/secrets
          readOnly: true
        - name: directus-uploads
          mountPath: /directus/uploads
      terminationGracePeriodSeconds: 45
      volumes:
      - name: secrets
        secret:
          secretName: oscb-secrets
          items:
          - key: mysql_password
            path: mysql_password
          - key: directus_password
            path: directus_password
          - key: directus_key
            path: directus_key
          - key: directus_secret
            path: directus_secret
      - name: directus-uploads
        persistentVolumeClaim:
          claimName: directus-uploads
