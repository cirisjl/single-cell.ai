---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-cpu
  labels:
    app.kubernetes.io/name: single-cell-ai
    app.kubernetes.io/component: worker-cpu
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: worker-cpu
  template:
    metadata:
      labels:
        app: worker-cpu
        app.kubernetes.io/part-of: single-cell-ai
    spec:
      containers:
      - name: worker-cpu
        image: stormgod/oscb-api:1.0
        imagePullPolicy: IfNotPresent
        command:
        - python3
        - /usr/local/bin/celery-entrypoint.py
        args:
        - celery
        - -A
        - main.celery
        - worker
        - --loglevel=info
        - -Q
        - cpu
        - --concurrency=4
        - --prefetch-multiplier=1
        - --max-tasks-per-child=50
        - --max-memory-per-child=100000000
        envFrom:
        - configMapRef:
            name: oscb-app-config
        resources:
          requests:
            cpu: '1'
            memory: 1Gi
          limits:
            cpu: '6'
            memory: 10Gi
        volumeMounts:
        - name: secrets
          mountPath: /run/secrets
          readOnly: true
        - name: shared-data
          mountPath: /data/results
          subPath: results
        - name: shared-data
          mountPath: /data/upload
          subPath: uploads
        - name: shared-data
          mountPath: /data/logs
          subPath: logs
        - name: shared-data
          mountPath: /data/errors
          subPath: errors
        - name: shared-data
          mountPath: /usr/src/app/storage
          subPath: user_storage
      terminationGracePeriodSeconds: 120
      volumes:
      - name: secrets
        secret:
          secretName: oscb-secrets
          items:
          - key: rabbitmq_password
            path: rabbitmq_password
          - key: redis_password
            path: redis_password
      - name: shared-data
        persistentVolumeClaim:
          claimName: oscb-shared-data
