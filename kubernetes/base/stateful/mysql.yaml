---
apiVersion: v1
kind: Service
metadata:
  name: oscb-mysql-headless
  labels:
    app.kubernetes.io/name: single-cell-ai
    app.kubernetes.io/component: oscb-mysql-headless
spec:
  selector:
    app: oscb-mysql
  ports:
  - name: mysql
    port: 3308
    targetPort: 3308
  clusterIP: None
---
apiVersion: v1
kind: Service
metadata:
  name: oscb-mysql
  labels:
    app.kubernetes.io/name: single-cell-ai
    app.kubernetes.io/component: oscb-mysql
spec:
  selector:
    app: oscb-mysql
  ports:
  - name: mysql
    port: 3308
    targetPort: 3308
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oscb-mysql
  labels:
    app.kubernetes.io/name: single-cell-ai
    app.kubernetes.io/component: oscb-mysql
spec:
  serviceName: oscb-mysql-headless
  replicas: 1
  selector:
    matchLabels:
      app: oscb-mysql
  template:
    metadata:
      labels:
        app: oscb-mysql
        app.kubernetes.io/part-of: single-cell-ai
    spec:
      containers:
      - name: oscb-mysql
        image: mysql:8.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: mysql
          containerPort: 3308
        args:
        - --character-set-server=utf8mb4
        - --collation-server=utf8mb4_unicode_ci
        - --default-authentication-plugin=mysql_native_password
        - --port=3308
        envFrom:
        - configMapRef:
            name: oscb-app-config
        env:
        - name: MYSQL_ROOT_PASSWORD_FILE
          value: /run/secrets/mysql_password
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '3'
            memory: 5Gi
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - MYSQL_PWD="$(cat /run/secrets/mysql_password)" mysql --protocol=TCP
              -h 127.0.0.1 -P 3308 -uroot -Nse "SELECT 1" | grep -qx 1
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 3308
          initialDelaySeconds: 60
          periodSeconds: 15
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
        - name: secrets
          mountPath: /run/secrets
          readOnly: true
      terminationGracePeriodSeconds: 60
      volumes:
      - name: secrets
        secret:
          secretName: oscb-secrets
          items:
          - key: mysql_password
            path: mysql_password
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 30Gi
