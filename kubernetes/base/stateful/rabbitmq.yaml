---
apiVersion: v1
kind: Service
metadata:
  name: oscb-rabbitmq-headless
  labels:
    app.kubernetes.io/name: single-cell-ai
    app.kubernetes.io/component: oscb-rabbitmq-headless
spec:
  selector:
    app: oscb-rabbitmq
  ports:
  - name: amqp
    port: 5672
    targetPort: 5672
  - name: management
    port: 15672
    targetPort: 15672
  clusterIP: None
---
apiVersion: v1
kind: Service
metadata:
  name: oscb-rabbitmq
  labels:
    app.kubernetes.io/name: single-cell-ai
    app.kubernetes.io/component: oscb-rabbitmq
spec:
  selector:
    app: oscb-rabbitmq
  ports:
  - name: amqp
    port: 5672
    targetPort: 5672
  - name: management
    port: 15672
    targetPort: 15672
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oscb-rabbitmq
  labels:
    app.kubernetes.io/name: single-cell-ai
    app.kubernetes.io/component: oscb-rabbitmq
spec:
  serviceName: oscb-rabbitmq-headless
  replicas: 1
  selector:
    matchLabels:
      app: oscb-rabbitmq
  template:
    metadata:
      labels:
        app: oscb-rabbitmq
        app.kubernetes.io/part-of: single-cell-ai
    spec:
      containers:
      - name: oscb-rabbitmq
        image: rabbitmq:4.2.8-management
        imagePullPolicy: IfNotPresent
        ports:
        - name: amqp
          containerPort: 5672
        - name: management
          containerPort: 15672
        command:
        - /bin/sh
        - -ec
        args:
        - export RABBITMQ_DEFAULT_PASS="$(cat /run/secrets/rabbitmq_password)"; exec
          rabbitmq-server
        envFrom:
        - configMapRef:
            name: oscb-app-config
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 3Gi
        readinessProbe:
          exec:
            command:
            - rabbitmq-diagnostics
            - -q
            - ping
          initialDelaySeconds: 25
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 5672
          initialDelaySeconds: 45
          periodSeconds: 15
        volumeMounts:
        - name: data
          mountPath: /var/lib/rabbitmq
        - name: secrets
          mountPath: /run/secrets
          readOnly: true
      terminationGracePeriodSeconds: 60
      volumes:
      - name: secrets
        secret:
          secretName: oscb-secrets
          items:
          - key: rabbitmq_password
            path: rabbitmq_password
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
